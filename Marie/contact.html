<form>

<div>
<label>First Name</label>
<input type="text" placeholder="Sophia" required>
</div>

<br>

<label>Last Name</label>
<input type="text" placeholder="Elizabeth" required>
</div>

<br>

<div>
<label>Password</label>
<input type="password" maxlength="13" required>
</div>

<br>

<div>
    <label>Email</label>
    <input type="email" placeholder="spants@gmail.com">
</div>

<br>

<div>
    <label>Phone Number</label>
    <input type="tel" placeholder="+233 564 2555">
    </div>

    <br>

<div>
<label>Date of Birth</label>
<input type="date">
</div>

<br>

<div>

<label>Dr.</label>
<input type="radio" name="title" value="Dr.">
<div>

<br>

<div>
<label for="payment"> Payment option</label> 
<select id="payment" name="payment">
    <option value="Mobile Money">Mobile Money</option>
    <option value="Bank">Bank</option>
    <option value="Cash">Cash</option>
    <select>
    </div>

    <br>

    <div>
    <label for="remember"> Remember Me</label>
    <input type="checkbox" id="remember" name="remember">
    </div>

<br>

<div>
    <input type="Submit">
</div>

<br>

<div>
    <input type="Reset">
</div>

</form>
